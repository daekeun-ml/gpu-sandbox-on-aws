name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "slides/gpu-sandbox-theory.pptx", "mkdocs.yml", "tools/handson_redirects.py", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "slides/gpu-sandbox-theory.pptx", "mkdocs.yml", "tools/handson_redirects.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      # strict mode turns broken links into build failures.
      - name: Build site (Korean + English)
        run: uv run --only-group docs mkdocs build --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
