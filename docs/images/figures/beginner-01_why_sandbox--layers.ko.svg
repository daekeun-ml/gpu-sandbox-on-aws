<svg xmlns="http://www.w3.org/2000/svg" width="760px" height="532px" viewBox="0 0 760 532" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C23B32"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA1AB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g id="n:code"><rect x="24" y="16" width="272" height="50" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><g transform="translate(108.5,31.0) scale(0.8333333333333334)" fill="#1F2328"><path d="M15.22 4.97a.75.75 0 0 1 1.06 0l6.5 6.5a.75.75 0 0 1 0 1.06l-6.5 6.5a.749.749 0 0 1-1.275-.326.75.75 0 0 1 .215-.734L21.19 12l-5.97-5.97a.75.75 0 0 1 0-1.06m-6.44 0a.75.75 0 0 1 0 1.06L2.81 12l5.97 5.97a.749.749 0 0 1-.326 1.275.75.75 0 0 1-.734-.215l-6.5-6.5a.75.75 0 0 1 0-1.06l6.5-6.5a.75.75 0 0 1 1.06 0"/></g><text x="175.0" y="38.0" font-size="13" fill="#1F2328" text-anchor="middle">모델이 쓴 코드</text><text x="175.0" y="55.0" font-size="12" fill="#1F2328" text-anchor="middle">채점하려고 실행</text><text x="616.0" y="100" font-size="12" fill="#1F2328" text-anchor="middle">주로 막는 위험</text><g id="n:layer1"><rect x="24" y="110" width="712" height="46" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="1.2"/></g><circle cx="130" cy="133.0" r="10" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/><text x="130" y="137.2" font-size="12" fill="#1F2328" text-anchor="middle">1</text><text x="152" y="129" font-size="13" fill="#1F2328" text-anchor="start">pod 보안 설정</text><text x="152" y="146" font-size="12" fill="#1F2328" text-anchor="start">root가 아닌 사용자, 권한 제거, 읽기 전용 파일 시스템</text><g id="n:risk1"><rect x="512" y="118" width="208" height="30" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="616.0" y="137.68" font-size="13" fill="#1F2328" text-anchor="middle">서버 파일 읽기</text><g id="n:layer2"><rect x="24" y="166" width="712" height="46" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="1.2"/></g><circle cx="130" cy="189.0" r="10" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/><text x="130" y="193.2" font-size="12" fill="#1F2328" text-anchor="middle">2</text><text x="152" y="185" font-size="13" fill="#1F2328" text-anchor="start">격리 런타임</text><text x="152" y="202" font-size="12" fill="#1F2328" text-anchor="start">gVisor 또는 Kata</text><g id="n:risk2"><rect x="512" y="174" width="208" height="30" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="616.0" y="193.68" font-size="13" fill="#1F2328" text-anchor="middle">커널 공격</text><g id="n:layer3"><rect x="24" y="222" width="712" height="46" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="1.2"/></g><circle cx="130" cy="245.0" r="10" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/><text x="130" y="249.2" font-size="12" fill="#1F2328" text-anchor="middle">3</text><text x="152" y="241" font-size="13" fill="#1F2328" text-anchor="start">네트워크 규칙</text><text x="152" y="258" font-size="12" fill="#1F2328" text-anchor="start">NetworkPolicy, 나가는 연결은 전부 차단</text><g id="n:risk3"><rect x="512" y="230" width="208" height="30" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="616.0" y="249.68" font-size="13" fill="#1F2328" text-anchor="middle">데이터 빼돌리기, 다른 곳으로 퍼지기</text><g id="n:layer4"><rect x="24" y="278" width="712" height="46" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="1.2"/></g><circle cx="130" cy="301.0" r="10" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/><text x="130" y="305.2" font-size="12" fill="#1F2328" text-anchor="middle">4</text><text x="152" y="297" font-size="13" fill="#1F2328" text-anchor="start">노드 설정</text><text x="152" y="314" font-size="12" fill="#1F2328" text-anchor="start">IMDSv2 필수, hop limit 1, node guard</text><g id="n:risk4"><rect x="512" y="286" width="208" height="30" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="616.0" y="305.68" font-size="13" fill="#1F2328" text-anchor="middle">자격 증명 빼내기</text><g id="n:layer5"><rect x="24" y="334" width="712" height="46" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="1.2"/></g><circle cx="130" cy="357.0" r="10" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/><text x="130" y="361.2" font-size="12" fill="#1F2328" text-anchor="middle">5</text><text x="152" y="353" font-size="13" fill="#1F2328" text-anchor="start">자격 증명 없음</text><text x="152" y="370" font-size="12" fill="#1F2328" text-anchor="start">샌드박스 안에 두지 않는 AWS 키, Kubernetes 토큰</text><g id="n:risk5"><rect x="512" y="342" width="208" height="30" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="616.0" y="361.68" font-size="13" fill="#1F2328" text-anchor="middle">다른 곳으로 퍼지기</text><g id="n:layer6"><rect x="24" y="390" width="712" height="46" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="1.2"/></g><circle cx="130" cy="413.0" r="10" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/><text x="130" y="417.2" font-size="12" fill="#1F2328" text-anchor="middle">6</text><text x="152" y="409" font-size="13" fill="#1F2328" text-anchor="start">자원과 시간 한도</text><text x="152" y="426" font-size="12" fill="#1F2328" text-anchor="start">CPU, 메모리, 실행 시간</text><g id="n:risk6"><rect x="512" y="398" width="208" height="30" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="616.0" y="417.68" font-size="13" fill="#1F2328" text-anchor="middle">자원 독차지</text><g id="n:target"><rect x="24" y="460" width="272" height="50" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><g transform="translate(64.5,475.0) scale(0.8333333333333334)" fill="#1F2328"><path d="M10.75 6.5a.75.75 0 0 0 0 1.5h6.5a.75.75 0 0 0 0-1.5zM6 7.25a.75.75 0 0 1 .75-.75h.5a.75.75 0 0 1 0 1.5h-.5A.75.75 0 0 1 6 7.25m4 9a.75.75 0 0 1 .75-.75h6.5a.75.75 0 0 1 0 1.5h-6.5a.75.75 0 0 1-.75-.75m-3.25-.75a.75.75 0 0 0 0 1.5h.5a.75.75 0 0 0 0-1.5z"/><path d="M3.25 2h17.5c.966 0 1.75.784 1.75 1.75v7c0 .372-.116.716-.314 1 .198.284.314.628.314 1v7a1.75 1.75 0 0 1-1.75 1.75H3.25a1.75 1.75 0 0 1-1.75-1.75v-7c0-.358.109-.707.314-1a1.74 1.74 0 0 1-.314-1v-7C1.5 2.784 2.284 2 3.25 2m0 10.5a.25.25 0 0 0-.25.25v7c0 .138.112.25.25.25h17.5a.25.25 0 0 0 .25-.25v-7a.25.25 0 0 0-.25-.25Zm0-1.5h17.5a.25.25 0 0 0 .25-.25v-7a.25.25 0 0 0-.25-.25H3.25a.25.25 0 0 0-.25.25v7c0 .138.112.25.25.25"/></g><text x="175.0" y="489.68" font-size="13" fill="#1F2328" text-anchor="middle">서버의 파일, 자격 증명, 네트워크</text><path d="M92.0,66 L92.0,458" fill="none" stroke="#1F2328" stroke-width="2.0" marker-end="url(#head-ink)"/></svg>
