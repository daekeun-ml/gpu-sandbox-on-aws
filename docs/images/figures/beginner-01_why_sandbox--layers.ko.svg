<svg xmlns="http://www.w3.org/2000/svg" width="760px" height="428px" viewBox="0 0 760 428" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C23B32"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA1AB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="16" y="24" font-size="14" font-weight="600" fill="#1F2328" text-anchor="start">샌드박스의 여섯 층</text><text x="528" y="24" font-size="12" font-weight="600" fill="#1F2328" text-anchor="middle">막는 위험</text><text x="348.0" y="48" font-size="12" fill="#1F2328" text-anchor="middle">서버 파일</text><text x="348.0" y="63" font-size="12" fill="#1F2328" text-anchor="middle">읽기</text><text x="420.0" y="48" font-size="12" fill="#1F2328" text-anchor="middle">자격 증명</text><text x="420.0" y="63" font-size="12" fill="#1F2328" text-anchor="middle">빼내기</text><text x="492.0" y="48" font-size="12" fill="#1F2328" text-anchor="middle">다른 곳으로</text><text x="492.0" y="63" font-size="12" fill="#1F2328" text-anchor="middle">퍼지기</text><text x="564.0" y="48" font-size="12" fill="#1F2328" text-anchor="middle">커널</text><text x="564.0" y="63" font-size="12" fill="#1F2328" text-anchor="middle">공격</text><text x="636.0" y="48" font-size="12" fill="#1F2328" text-anchor="middle">자원</text><text x="636.0" y="63" font-size="12" fill="#1F2328" text-anchor="middle">독차지</text><text x="708.0" y="48" font-size="12" fill="#1F2328" text-anchor="middle">데이터</text><text x="708.0" y="63" font-size="12" fill="#1F2328" text-anchor="middle">빼돌리기</text><g id="n:layer1"><rect x="16" y="76" width="728" height="46" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="1.2"/></g><circle cx="38" cy="99.0" r="10" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/><text x="38" y="103.2" font-size="12" fill="#1F2328" text-anchor="middle">1</text><text x="60" y="95" font-size="13" fill="#1F2328" text-anchor="start">pod 보안 설정</text><text x="60" y="112" font-size="12" fill="#1F2328" text-anchor="start">root가 아닌 사용자, 권한 제거</text><circle cx="348.0" cy="99.0" r="7" fill="#1F6FB2"/><circle cx="420.0" cy="99.0" r="2" fill="#C3C8CF"/><circle cx="492.0" cy="99.0" r="2" fill="#C3C8CF"/><circle cx="564.0" cy="99.0" r="2" fill="#C3C8CF"/><circle cx="636.0" cy="99.0" r="2" fill="#C3C8CF"/><circle cx="708.0" cy="99.0" r="2" fill="#C3C8CF"/><g id="n:layer2"><rect x="16" y="128" width="728" height="46" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="1.2"/></g><circle cx="38" cy="151.0" r="10" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/><text x="38" y="155.2" font-size="12" fill="#1F2328" text-anchor="middle">2</text><text x="60" y="147" font-size="13" fill="#1F2328" text-anchor="start">격리 런타임</text><text x="60" y="164" font-size="12" fill="#1F2328" text-anchor="start">gVisor 또는 Kata</text><circle cx="348.0" cy="151.0" r="7" fill="#1F6FB2"/><circle cx="420.0" cy="151.0" r="2" fill="#C3C8CF"/><circle cx="492.0" cy="151.0" r="2" fill="#C3C8CF"/><circle cx="564.0" cy="151.0" r="7" fill="#1F6FB2"/><circle cx="636.0" cy="151.0" r="2" fill="#C3C8CF"/><circle cx="708.0" cy="151.0" r="2" fill="#C3C8CF"/><g id="n:layer3"><rect x="16" y="180" width="728" height="46" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="1.2"/></g><circle cx="38" cy="203.0" r="10" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/><text x="38" y="207.2" font-size="12" fill="#1F2328" text-anchor="middle">3</text><text x="60" y="199" font-size="13" fill="#1F2328" text-anchor="start">네트워크 규칙</text><text x="60" y="216" font-size="12" fill="#1F2328" text-anchor="start">NetworkPolicy, 나가는 연결 기본 차단</text><circle cx="348.0" cy="203.0" r="2" fill="#C3C8CF"/><circle cx="420.0" cy="203.0" r="7" fill="#1F6FB2"/><circle cx="492.0" cy="203.0" r="7" fill="#1F6FB2"/><circle cx="564.0" cy="203.0" r="2" fill="#C3C8CF"/><circle cx="636.0" cy="203.0" r="2" fill="#C3C8CF"/><circle cx="708.0" cy="203.0" r="7" fill="#1F6FB2"/><g id="n:layer4"><rect x="16" y="232" width="728" height="46" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="1.2"/></g><circle cx="38" cy="255.0" r="10" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/><text x="38" y="259.2" font-size="12" fill="#1F2328" text-anchor="middle">4</text><text x="60" y="251" font-size="13" fill="#1F2328" text-anchor="start">노드 설정</text><text x="60" y="268" font-size="12" fill="#1F2328" text-anchor="start">IMDSv2 필수, hop limit 1, node guard</text><circle cx="348.0" cy="255.0" r="2" fill="#C3C8CF"/><circle cx="420.0" cy="255.0" r="7" fill="#1F6FB2"/><circle cx="492.0" cy="255.0" r="2" fill="#C3C8CF"/><circle cx="564.0" cy="255.0" r="2" fill="#C3C8CF"/><circle cx="636.0" cy="255.0" r="2" fill="#C3C8CF"/><circle cx="708.0" cy="255.0" r="2" fill="#C3C8CF"/><g id="n:layer5"><rect x="16" y="284" width="728" height="46" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="1.2"/></g><circle cx="38" cy="307.0" r="10" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/><text x="38" y="311.2" font-size="12" fill="#1F2328" text-anchor="middle">5</text><text x="60" y="303" font-size="13" fill="#1F2328" text-anchor="start">자격 증명 없음</text><text x="60" y="320" font-size="12" fill="#1F2328" text-anchor="start">AWS 키, 자체 서비스 계정 토큰 없음</text><circle cx="348.0" cy="307.0" r="2" fill="#C3C8CF"/><circle cx="420.0" cy="307.0" r="2" fill="#C3C8CF"/><circle cx="492.0" cy="307.0" r="7" fill="#1F6FB2"/><circle cx="564.0" cy="307.0" r="2" fill="#C3C8CF"/><circle cx="636.0" cy="307.0" r="2" fill="#C3C8CF"/><circle cx="708.0" cy="307.0" r="2" fill="#C3C8CF"/><g id="n:layer6"><rect x="16" y="336" width="728" height="46" rx="6" fill="#FFFFFF" stroke="#1F6FB2" stroke-width="1.2"/></g><circle cx="38" cy="359.0" r="10" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/><text x="38" y="363.2" font-size="12" fill="#1F2328" text-anchor="middle">6</text><text x="60" y="355" font-size="13" fill="#1F2328" text-anchor="start">자원과 시간 한도</text><text x="60" y="372" font-size="12" fill="#1F2328" text-anchor="start">CPU, 메모리, 실행 시간</text><circle cx="348.0" cy="359.0" r="2" fill="#C3C8CF"/><circle cx="420.0" cy="359.0" r="2" fill="#C3C8CF"/><circle cx="492.0" cy="359.0" r="2" fill="#C3C8CF"/><circle cx="564.0" cy="359.0" r="2" fill="#C3C8CF"/><circle cx="636.0" cy="359.0" r="7" fill="#1F6FB2"/><circle cx="708.0" cy="359.0" r="2" fill="#C3C8CF"/><text x="16" y="404" font-size="12" fill="#1F2328" text-anchor="start">점은 그 층이 막는 위험입니다. 한 위험을 여러 층이 함께 막기도 합니다.</text></svg>
