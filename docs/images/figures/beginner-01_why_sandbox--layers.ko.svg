<svg xmlns="http://www.w3.org/2000/svg" width="512px" height="434px" viewBox="0 0 512 434" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C23B32"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA1AB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><title>정렬 함수에 적용하는 세 가지 제한</title><desc>반복문은 정해진 시간이 지나면 멈춥니다. 모델 파일은 학습 서버에 두고, 샌드박스에서 외부로 여는 연결은 기본으로 차단합니다.</desc><text x="16" y="31" font-size="24" font-weight="600" fill="#1F2328" text-anchor="start">정렬 함수에 적용하는 세 가지 제한</text><rect x="12" y="48" width="488" height="102" rx="10" fill="#FFFFFF" stroke="#C3C8CF" stroke-width="1.2"/><g transform="translate(28,60) scale(1.0)" fill="#1F6FB2"><path d="M12.5 7.25a.75.75 0 0 0-1.5 0v5.5c0 .27.144.518.378.651l3.5 2a.75.75 0 0 0 .744-1.302L12.5 12.315z"/><path d="M12 1c6.075 0 11 4.925 11 11s-4.925 11-11 11S1 18.075 1 12 5.925 1 12 1M2.5 12a9.5 9.5 0 0 0 9.5 9.5 9.5 9.5 0 0 0 9.5-9.5A9.5 9.5 0 0 0 12 2.5 9.5 9.5 0 0 0 2.5 12"/></g><text x="63" y="80" font-size="21" font-weight="600" fill="#1F2328" text-anchor="start">실행 시간</text><rect x="12" y="160" width="488" height="138" rx="10" fill="#FFFFFF" stroke="#C3C8CF" stroke-width="1.2"/><g transform="translate(28,172) scale(1.0)" fill="#1F6FB2"><path d="M2 4.75C2 3.784 2.784 3 3.75 3h4.971c.58 0 1.12.286 1.447.765l1.404 2.063c.046.069.1