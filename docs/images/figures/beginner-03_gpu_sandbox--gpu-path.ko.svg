<svg xmlns="http://www.w3.org/2000/svg" width="530px" height="298px" viewBox="0 0 530 298" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C23B32"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA1AB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="16" y="31" font-size="24" font-weight="600" fill="#1F2328" text-anchor="start">샌드박스에서 GPU까지</text><text x="16" y="65" font-size="21" font-weight="600" fill="#1F6FB2" text-anchor="start">gVisor</text><text x="16" y="93" font-size="17" fill="#1F2328" text-anchor="start">nvproxy가 허용한 요청을 노드 드라이버로 전달합니다.</text><rect x="16" y="106" width="84" height="46" rx="6" fill="#F3F4F6" stroke="#C3C8CF" stroke-width="1.2"/><text x="58.0" y="134" font-size="17" font-weight="600" fill="#1F2328" text-anchor="middle">코드</text><path d="M100,129 L126.0,129" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><rect x="128.0" y="106" width="106" height="46" rx="6" fill="#F3F4F6" stroke="#C3C8CF" stroke-width="1.2"/><text x="181.0" y="134" font-size="17" font-weight="600" fill="#1F2328" text-anchor="middle">요청 검사</text><path d="M234.0,129 L260.0,129" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><rect x="262.0" y="106" width="146" height="46" rx="6" fill="#E8F1FA" stroke="#C3C8CF" stroke-width="1.2"/><text x="335.0" y="134" font-size="17" font-weight="600" fill="#1F2328" text-anchor="middle">노드 드라이버</text><path d="M408.0,129 L434.0,129" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><rect x="436.0" y="106" width="78" height="46" rx="6" fill="#F3F4F6" stroke="#C3C8CF" stroke-width="1.2"/><text x="475.0" y="134" font-size="17" font-weight="600" fill="#1F2328" text-anchor="middle">A10G</text><text x="16" y="191" font-size="21" font-weight="600" fill="#1F6FB2" text-anchor="start">Kata + QEMU</text><text x="16" y="219" font-size="17" fill="#1F2328" text-anchor="start">VM 안의 드라이버가 배정받은 물리 GPU를 사용합니다.</text><rect x="16" y="232" width="138" height="46" rx="6" fill="#F3F4F6" stroke="#C3C8CF" stroke-width="1.2"/><text x="85.0" y="260" font-size="17" font-weight="600" fill="#1F2328" text-anchor="middle">VM 안의 코드</text><path d="M154,255 L188.0,255" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><rect x="190.0" y="232" width="188" height="46" rx="6" fill="#E8F1FA" stroke="#C3C8CF" stroke-width="1.2"/><text x="284.0" y="260" font-size="17" font-weight="600" fill="#1F2328" text-anchor="middle">VM 안의 드라이버</text><path d="M378.0,255 L412.0,255" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><rect x="414.0" y="232" width="100" height="46" rx="6" fill="#F3F4F6" stroke="#C3C8CF" stroke-width="1.2"/><text x="464.0" y="260" font-size="17" font-weight="600" fill="#1F2328" text-anchor="middle">T4</text></svg>
