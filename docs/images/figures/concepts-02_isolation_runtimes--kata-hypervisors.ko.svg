<svg xmlns="http://www.w3.org/2000/svg" width="600px" height="304px" viewBox="0 0 600 304" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C23B32"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA1AB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><title>게스트 명령 실행과 가상 디스크 구성</title><desc>QEMU는 하드웨어 가상화와 명령어 번역을 지원하고, Cloud Hypervisor는 하드웨어 가상화를 이용합니다. 같은 디스크 이미지를 QEMU는 IDE나 virtio-blk로, Cloud Hypervisor는 virtio-blk로 제공합니다.</desc><text x="300" y="23" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle">게스트 명령 실행과 가상 디스크 구성</text><rect x="10" y="40" width="280" height="82" rx="6" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1.2"/><text x="150" y="64" font-size="17" font-weight="600" fill="#1F2328" text-anchor="middle">QEMU</text><text x="150" y="85" font-size="13" fill="#1F2328" text-anchor="middle">다양한 컴퓨터와 장치를 재현</text><text x="150" y="109" font-size="12" font-weight="600" fill="#1F2328" text-anchor="middle">하드웨어 가상화 또는 명령어 번역</text><rect x="310" y="40" width="280" height="82" rx="6" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1.2"/><text x="450" y="64" font-size="17" font-weight="600" fill="#1F2328" text-anchor="middle">Cloud Hypervisor</text><text x="450" y="85" font-size="13" fill="#1F2328" text-anchor="middle">최신 클라우드 게스트에 맞춘 VMM</text><text x="450" y="109" font-size="12" font-weight="600" fill="#1F2328" text-anchor="middle">하드웨어 가상화로 게스트 명령 실행</text><path d="M150,122 L150,167" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><path d="M222,122 L222,145 L379,145 L379,167" fill="none" stroke="#1F6FB2" stroke-width="1.6" marker-end="url(#head-accent)"/><path d="M450,122 L450,167" fill="none" stroke="#1F6FB2" stroke-width="1.6" marker-end="url(#head-accent)"/><rect x="10" y="169" width="280" height="51" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/><text x="150.0" y="191.5" font-size="13" fill="#1F2328" text-anchor="middle">IDE 컨트롤러</text><text x="150.0" y="208.5" font-size="12" fill="#1F2328" text-anchor="middle">IDE 드라이버가 레지스터에 명령 기록</text><rect x="310" y="169" width="280" height="51" rx="6" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/><text x="450.0" y="191.5" font-size="13" fill="#1F2328" text-anchor="middle">virtio-blk 디스크</text><text x="450.0" y="208.5" font-size="12" fill="#1F2328" text-anchor="middle">virtio 드라이버가 공유 큐에 요청 등록</text><path d="M150,220 L150,232 L450,232 L450,220" fill="none" stroke="#1F2328" stroke-width="1.6"/><path d="M300,232 L300,250" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><rect x="155" y="252" width="290" height="44" rx="6" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1.2"/><g transform="translate(220.5,264.0) scale(0.8333333333333334)" fill="#1F2328"><path d="M12 1.25c2.487 0 4.773.402 6.466 1.079.844.337 1.577.758 2.112 1.264.536.507.922 1.151.922 1.907v12.987l-.026.013h.026c0 .756-.386 1.4-.922 1.907-.535.506-1.268.927-2.112 1.264-1.693.677-3.979 1.079-6.466 1.079s-4.774-.402-6.466-1.079c-.844-.337-1.577-.758-2.112-1.264C2.886 19.9 2.5 19.256 2.5 18.5h.026l-.026-.013V5.5c0-.756.386-1.4.922-1.907.535-.506 1.268-.927 2.112-1.264C7.226 1.652 9.513 1.25 12 1.25M4 14.371v4.116l-.013.013H4c0 .211.103.487.453.817.351.332.898.666 1.638.962 1.475.589 3.564.971 5.909.971s4.434-.381 5.909-.971c.739-.296 1.28