와 버전을 관리하는 gateway 하나</text><g id="n:trl-b"><rect x="16" y="346" width="170" height="44" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="101.0" y="372.68" font-size="13" fill="#1F2328" text-anchor="middle">TRL rank 0</text><g id="n:verl-b"><rect x="16" y="400" width="170" height="44" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="101.0" y="426.68" font-size="13" fill="#1F2328" text-anchor="middle">veRL reward worker</text><g id="n:s1-b"><rect x="16" y="470" width="170" height="44" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="101.0" y="496.68" font-size="13" fill="#1F2328" text-anchor="middle">group 17 샘플 1</text><g id="n:s2-b"><rect x="16" y="524" width="170" height="44" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="101.0" y="543.0" font-size="13" fill="#1F2328" text-anchor="middle">group 17 샘플 2</text><text x="101.0" y="560.0" font-size="12" fill="#1F2328" text-anchor="middle">routing 전환 뒤</text><g id="n:gateway"><rect x="286" y="346" width="150" height="222" rx="6" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/></g><text x="361.0" y="445.0" font-size="13" fill="#1F2328" text-anchor="middle">sandbox gateway</text><text x="361.0" y="462.0" font-size="12" fill="#1F2328" text-anchor="middle">in-flight를 한곳에서 집계</text><text x="361.0" y="479.0" font-size="12" fill="#1F2328" text-anchor="middle">group_key pin</text><g id="n:podA-b"><rect x="536" y="346" width="208" height="44" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="640.0" y="372.68" font-size="13" fill="#1F2328" text-anchor="middle">샌드박스 pod A</text><g id="n:podB-b"><rect x="536" y="400" width="208" height="44" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="640.0" y="426.68" font-size="13" fill="#1F2328" text-anchor="middle">샌드박스 pod B</text><g id="n:v1-b"><rect x="536" y="470" width="208" height="98" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="640.0" y="516.0" font-size="13" fill="#1F2328" text-anchor="middle">v1로 채점</text><text x="640.0" y="533.0" font-size="12" fill="#1F2328" text-anchor="middle">group pin, TTL 900초</text><path d="M186,368.0 L284,368.0" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><path d="M186,422.0 L284,422.0" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><path d="M186,492.0 L284,492.0" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><path d="M186,546.0 L284,546.0" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><path d="M436,368.0 L534,368.0" fill="none" stroke="#1F6FB2" stroke-width="1.6" marker-end="url(#head-accent)"/><text x="486.0" y="360.0" font-size="12" fill="#1F2328" text-anchor="middle">동시 1건</text><path d="M436,422.0 L534,422.0" fill="none" stroke="#1F6FB2" stroke-width="1.6" marker-end="url(#head-accent)"/><text x="486.0" y="414.0" font-size="12" fill="#1F2328" text-anchor="middle">동시 1건</text><path d="M436,519.0 L534,519.0" fill="none" stroke="#1F6FB2" stroke-width="1.6" marker-end="url(#head-accent)"/><text x="486.0" y="511.0" font-size="12" fill="#1F2328" text-anchor="middle">첫 샘플의 버전</text></svg>
