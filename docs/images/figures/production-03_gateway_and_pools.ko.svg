<svg xmlns="http://www.w3.org/2000/svg" width="760px" height="576px" viewBox="0 0 760 576" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C23B32"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA1AB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="16" y="26" font-size="16" font-weight="600" fill="#1F2328" text-anchor="start">a</text><text x="34" y="26" font-size="14" font-weight="600" fill="#1F2328" text-anchor="start">호출자마다 pod 선택, 샘플마다 따로 채점</text><g id="n:trl-a"><rect x="16" y="54" width="170" height="44" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="101.0" y="80.68" font-size="13" fill="#1F2328" text-anchor="middle">TRL rank 0</text><g id="n:verl-a"><rect x="16" y="108" width="170" height="44" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="101.0" y="134.68" font-size="13" fill="#1F2328" text-anchor="middle">veRL reward worker</text><g id="n:s1-a"><rect x="16" y="178" width="170" height="44" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="101.0" y="204.68" font-size="13" fill="#1F2328" text-anchor="middle">group 17 샘플 1</text><g id="n:s2-a"><rect x="16" y="232" width="170" height="44" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="101.0" y="251.0" font-size="1