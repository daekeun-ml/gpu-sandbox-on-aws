<svg xmlns="http://www.w3.org/2000/svg" width="760px" height="526px" viewBox="0 0 760 526" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C23B32"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA1AB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g id="n:A"><rect x="16" y="24.5" width="196" height="47" rx="6" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/></g><text x="114.0" y="44.18" font-size="13" fill="#1F2328" text-anchor="middle">GPU needed</text><text x="114.0" y="61.18" font-size="12" fill="#1F2328" text-anchor="middle">inside the sandbox</text><g id="n:B"><rect x="272" y="24.5" width="140" height="47" rx="6" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/></g><text x="342.0" y="44.18" font-size="13" fill="#1F2328" text-anchor="middle">prefer a</text><text x="342.0" y="61.18" font-size="12" fill="#1F2328" text-anchor="middle">managed service</text><g id="n:C"><rect x="16" y="163.5" width="196" height="47" rx="6" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/></g><text x="114.0" y="183.18" font-size="13" fill="#1F2328" text-anchor="middle">prefer a managed</text><text x="114.0" y="200.18" font-size="12" fill="#1F2328" text-anchor="middle">GPU sandbox</text><g id="n:D"><rect x="16" y="253.0" width="196" height="64" rx="6" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/></g><text x="114.0" y="272.68" font-size="13" fill="#1F2328" text-anchor="middle">VM boundary needed</text><text x="114.0" y="289.68" font-size="12" fill="#1F2328" text-anchor="middle">(adversarial code from</text><text x="114.0" y="306.68" font-size="12" fill="#1F2328" text-anchor="middle">different customers)</text><g id="n:E"><rect x="16" y="351.0" width="196" height="47" rx="6" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/></g><text x="114.0" y="370.68" font-size="13" fill="#1F2328" text-anchor="middle">T4 is acceptable</text><text x="114.0" y="387.68" font-size="12" fill="#1F2328" text-anchor="middle">for measurement</text><g id="n:B1"><rect x="452" y="16.0" width="292" height="64" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="598.0" y="35.68" font-size="13" fill="#1F2328" text-anchor="middle">AgentCore Code Interpreter or</text><text x="598.0" y="52.68" font-size="12" fill="#1F2328" text-anchor="middle">Nitro Sandboxes, EKS isolated pods</text><text x="598.0" y="69.68" font-size="12" fill="#1F2328" text-anchor="middle">(CPU only)</text><g id="n:B2"><rect x="452" y="94.0" width="292" height="47" rx="6" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/></g><text x="598.0" y="113.68" font-size="13" fill="#1F2328" text-anchor="middle">Kata + CLH on c8i</text><text x="598.0" y="130.68" font-size="12" fill="#1F2328" text-anchor="middle">(nested virtualization)</text><g id="n:C1"><rect x="452" y="155.0" width="292" height="64" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="598.0" y="174.68" font-size="13" fill="#1F2328" text-anchor="middle">third-party service</text><text x="598.0" y="191.68" font-size="12" fill="#1F2328" text-anchor="middle">(for example Modal, gVisor-based)</text><text x="598.0" y="208.68" font-size="12" fill="#1F2328" text-anchor="middle">out of scope for this asset</text><g id="n:F"><rect x="452" y="261.5" width="292" height="47" rx="6" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/></g><text x="598.0" y="281.18" font-size="13" fill="#1F2328" text-anchor="middle">gVisor + nvproxy on G/P family VMs</text><text x="598.0" y="298.18" font-size="12" fill="#1F2328" text-anchor="middle">g5 (A10G), g6 (L4), g6e (L40S), p5 (H100)</text><g id="n:E1"><rect x="452" y="351.0" width="292" height="47" rx="6" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/></g><text x="598.0" y="370.68" font-size="13" fill="#1F2328" text-anchor="middle">Kata + QEMU on g4dn.metal</text><text x="598.0" y="387.68" font-size="12" fill="#1F2328" text-anchor="middle">VM boundary + VFIO</text><g id="n:E2"><rect x="452" y="412.0" width="292" height="98" rx="6" fill="#FBEAE8" stroke="#C23B32" stroke-width="1.2"/></g><text x="598.0" y="431.68" font-size="13" fill="#C23B32" text-anchor="middle">EC2 has no VM boundary +</text><text x="598.0" y="448.68" font-size="12" fill="#C23B32" text-anchor="middle">current GPU combination</text><text x="598.0" y="465.68" font-size="12" fill="#C23B32" text-anchor="middle">accept the risk with gVisor +</text><text x="598.0" y="482.68" font-size="12" fill="#C23B32" text-anchor="middle">compensating controls, or</text><text x="598.0" y="499.68" font-size="12" fill="#C23B32" text-anchor="middle">revisit the requirements</text><path d="M212,48.0 L270,48.0" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><text x="242.0" y="40.0" font-size="12" fill="#1F2328" text-anchor="middle">no</text><path d="M412,48.0 L450,48.0" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><text x="432.0" y="40.0" font-size="12" fill="#1F2328" text-anchor="middle">yes</text><path d="M342.0,71.5 L342.0,117.5 L450,117.5" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><text x="348.0" y="98.5" font-size="12" fill="#1F2328" text-anchor="start">no</text><path d="M114.0,71.5 L114.0,161.5" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><text x="12