<svg xmlns="http://www.w3.org/2000/svg" width="760px" height="300px" viewBox="0 0 760 300" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C23B32"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA1AB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="16" y="77.0" font-size="12" font-weight="600" fill="#1F2328" text-anchor="start">GPU 경로</text><text x="16" y="135.0" font-size="12" font-weight="600" fill="#1F2328" text-anchor="start">필요한 것</text><text x="16" y="193.0" font-size="12" font-weight="600" fill="#1F2328" text-anchor="start">인스턴스</text><text x="16" y="251.0" font-size="12" font-weight="600" fill="#1F2328" text-anchor="start">hypervisor</text><rect x="86" y="16" width="214" height="266" rx="8" fill="none" stroke="#C3C8CF" stroke-width="1.2"/><text x="96" y="34" font-size="12" font-weight="600" fill="#1F2328" text-anchor="start">gVisor + GPU</text><g id="n:c0r0"><rect x="98" y="50" width="190" height="46" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="193.0" y="69.18" font-size="13" fill="#1F2328" text-anchor="middle">host 드라이버</text><text x="193.0" y="86.18" font-size="12" fill="#1F2328" text-anchor="middle">허용된 ioctl만 전달</text><g id="n:c0r1"><rect x="98" y="108" width="190" height="46" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="193.0" y="127.18" font-size="13" fill="#1F2328" text-anchor="middle">/dev/kvm 불필요</text><text x="193.0" y="144.18" font-size="12" fill="#1F2328" text-anchor="middle">systrap 플랫폼</text><g id="n:c0r2"><rect x="98" y="166" width="190" height="46" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="193.0" y="185.18" font-size="13" fill="#1F2328" text-anchor="middle">일반 GPU VM</text><text x="193.0" y="202.18" font-size="12" fill="#1F2328" text-anchor="middle">g5.xlarge 등</text><g id="n:c0r3"><rect x="98" y="224" width="190" height="46" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="193.0" y="243.18" font-size="13" fill="#1F2328" text-anchor="middle">해당 없음</text><text x="193.0" y="260.18" font-size="12" fill="#1F2328" text-anchor="middle">경계는 사용자 공간 커널</text><rect x="308" y="16" width="214" height="266" rx="8" fill="none" stroke="#C3C8CF" stroke-width="1.2"/><text x="318" y="34" font-size="12" font-weight="600" fill="#1F2328" text-anchor="start">Kata + GPU</text><g id="n:c1r0"><rect x="320" y="50" width="190" height="46" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="415.0" y="69.18" font-size="13" fill="#1F2328" text-anchor="middle">guest 드라이버</text><text x="415.0" y="86.18" font-size="12" fill="#1F2328" text-anchor="middle">GPU를 VM에 직접 할당 (VFIO)</text><g id="n:c1r1"><rect x="320" y="108" width="190" height="46" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="415.0" y="127.18" font-size="13" fill="#1F2328" text-anchor="middle">/dev/kvm, IOMMU</text><text x="415.0" y="144.18" font-size="12" fill="#1F2328" text-anchor="middle">GPU를 소유한 host</text><g id="n:c1r2"><rect x="320" y="166" width="190" height="46" rx="6" fill="#FBEAE8" stroke="#C23B32" stroke-width="1.2"/></g><text x="415.0" y="185.18" font-size="13" fill="#C23B32" text-anchor="middle">g4dn.metal만</text><text x="415.0" y="202.18" font-size="12" fill="#C23B32" text-anchor="middle">x86 NVIDIA GPU의 유일한 .metal</text><g id="n:c1r3"><rect x="320" y="224" width="190" height="46" rx="6" fill="#FBEAE8" stroke="#C23B32" stroke-width="1.2"/></g><text x="415.0" y="243.18" font-size="13" fill="#C23B32" text-anchor="middle">upstream 지원은 QEMU만</text><text x="415.0" y="260.18" font-size="12" fill="#C23B32" text-anchor="middle">Cloud Hypervisor는 미지원</text><rect x="530" y="16" width="214" height="266" rx="8" fill="none" stroke="#C3C8CF" stroke-width="1.2"/><text x="540" y="34" font-size="12" font-weight="600" fill="#1F2328" text-anchor="start">Kata CPU 전용</text><g id="n:c2r0"><rect x="542" y="50" width="190" height="46" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="637.0" y="69.18" font-size="13" fill="#1F2328" text-anchor="middle">GPU 없음</text><text x="637.0" y="86.18" font-size="12" fill="#1F2328" text-anchor="middle">CPU 샌드박스</text><g id="n:c2r1"><rect x="542" y="108" width="190" height="46" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="637.0" y="127.18" font-size="13" fill="#1F2328" text-anchor="middle">/dev/kvm</text><text x="637.0" y="144.18" font-size="12" fill="#1F2328" text-anchor="middle">nested virtualization으로 제공</text><g id="n:c2r2"><rect x="542" y="166" width="190" height="46" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="637.0" y="185.18" font-size="13" fill="#1F2328" text-anchor="middle">nested virtualization VM</text><text x="637.0" y="202.18" font-size="12" fill="#1F2328" text-anchor="middle">c8i.2xlarge 등, 2026-02부터</text><g id="n:c2r3"><rect x="542" y="224" width="190" height="46" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="637.0" y="243.18" font-size="13" fill="#1F2328" text-anchor="middle">Cloud Hypervisor, QEMU</text><text x="637.0" y="260.18" font-size="12" fill="#1F2328" text-anchor="middle">둘 다 지원</text></svg>
