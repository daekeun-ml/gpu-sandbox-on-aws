<svg xmlns="http://www.w3.org/2000/svg" width="512px" height="370px" viewBox="0 0 512 370" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C23B32"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA1AB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="14" y="30" font-size="22" font-weight="600" fill="#1F2328" text-anchor="start">서로 다른 답을 한 번씩 채점할 때</text><rect x="14" y="46" width="144" height="46" rx="6" fill="#F3F4F6" stroke="#C3C8CF" stroke-width="1.2"/><text x="86.0" y="74" font-size="17" font-weight="600" fill="#1F2328" text-anchor="middle">답안 하나</text><path d="M158,69 L334,69" fill="none" stroke="#1F6FB2" stroke-width="2" marker-end="url(#head-accent)"/><rect x="338" y="46" width="160" height="46" rx="6" fill="#E8F1FA" stroke="#C3C8CF" stroke-width="1.2"/><text x="418.0" y="74" font-size="17" font-weight="600" fill="#1F2328" text-anchor="middle">빈 샌드박스</text><path d="M14,112 L498,112" fill="none" stroke="#C3C8CF" stroke-width="1"/><text x="14" y="150" font-size="22" font-weight="600" fill="#1F2328" text-anchor="start">한 문제에 다시 도전할 때</text><rect x="14" y="169" width="128" height="150" rx="6" fill="#F3F4F6" stroke="#C3C8CF" stroke-width="1.2"/><rect x="368" y="169" width="130" height="150" rx="6" fill="#E8F1FA" stroke="#C3C8CF" stroke-width="1.2"/><text x="78" y="250" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle">에이전트</text><text x="433" y="250" font-size="17" font-weight="600" fill="#1F2328" text-anchor="middle">같은 샌드박스</text><path d="M142,192 L366,192" fill="none" stroke="#1F6FB2" stroke-width="2" marker-end="url(#head-accent)"/><text x="255" y="186" font-size="16" fill="#1F2328" text-anchor="middle">코드 제출</text><path d="M368,229 L144,229" fill="none" stroke="#1F2328" stroke-width="2" marker-end="url(#head-ink)"/><text x="255" y="223" font-size="16" fill="#1F2328" text-anchor="middle">wrong_answer</text><path d="M142,267 L366,267" fill="none" stroke="#1F6FB2" stroke-width="2" marker-end="url(#head-accent)"/><text x="255" y="261" font-size="16" fill="#1F2328" text-anchor="middle">고친 코드 제출</text><path d="M368,305 L144,305" fill="none" stroke="#1F2328" stroke-width="2" marker-end="url(#head-ink)"/><text x="255" y="299" font-size="16" fill="#1F2328" text-anchor="middle">ok</text><text x="14" y="352" font-size="17" fill="#1F2328" text-anchor="start">에피소드가 끝나면 샌드박스를 반납합니다.</text></svg>
