<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 196" width="520" height="196" role="img" aria-labelledby="title description">
  <title id="title">Testing a sorting function in a sandbox</title>
  <desc id="description">The trainer sends the sorting code. The sandbox finds that the output differs from the expected order and returns a wrong-answer verdict.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10z" fill="#1f6fb2"/></marker></defs>
  <rect width="520" height="196" rx="10" fill="#fff"/>
  <g stroke="#9aa1ab"><rect x="7" y="10" width="153" height="176" rx="10" fill="#f3f4f6"/><rect x="360" y="10" width="153" height="176" rx="10" fill="#e8f1fa" stroke="#1f6fb2"/></g>
  <g text-anchor="middle" font-family="Pretendard, 'Noto Sans KR', sans-serif" fill="#1f2328">
    <g font-size="20" font-weight="600"><text x="84" y="44">Training server</text><text x="436" y="44">Sandbox</text></g>
    <g font-size="17"><text x="84" y="89">Trainer</text><text x="84" y="142">Holds model files</text><text x="436" y="89">Run the function</text>
      <text x="436" y="127">Expected [1, 2, 3]</text><text x="436" y="154">Output [1, 3, 2]</text>
      <text x="260" y="67">Code and task ID</text><text x="260" y="114">Verdict</text><text x="260" y="168" font-family="monospace">wrong_answer</text>
    </g>
  </g>
  <g fill="none" stroke="#1f6fb2" stroke-width="2" marker-end="url(#arrow)"><path d="M160 80H357"/><path d="M360 130H163"/></g>
</svg>
