<svg xmlns="http://www.w3.org/2000/svg" width="760px" height="296px" viewBox="0 0 760 296" role="img" aria-labelledby="title description">
  <title id="title">Training and sandbox execution boundary</title>
  <desc id="description">The trainer sends code and a task ID to a separate sandbox. The sandbox executes the code and returns the verdict.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4e9e"/>
    </marker>
  </defs>
  <rect width="760" height="296" rx="14" fill="#fff"/>
  <g font-family="system-ui, 'Noto Sans KR', 'NanumGothic', sans-serif" fill="#18263b" text-anchor="middle">
    <rect x="24" y="24" width="222" height="248" rx="12" fill="#f5f7fb" stroke="#909fb3"/>
    <rect x="514" y="24" width="222" height="248" rx="12" fill="#edf4ff" stroke="#3765a8" stroke-width="2"/>
    <g font-size="22" font-weight="700">
      <text x="135" y="61">Training</text>
      <text x="625" y="61">Sandbox</text>
    </g>
    <g fill="#fff" stroke="#a1aec1">
      <rect x="46" y="86" width="178" height="104" rx="9"/>
      <rect x="536" y="86" width="178" height="104" rx="9"/>
    </g>
    <g font-size="19">
      <text x="135" y="145">Trainer</text>
      <text x="625" y="145">Run submission</text>
    </g>
    <g stroke="#1d4e9e" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 224 118 H 532"/>
      <path d="M 536 165 H 228"/>
    </g>
    <g font-size="17">
      <text x="380" y="106">Code and task ID</text>
      <text x="380" y="153">Verdict</text>
      <text x="135" y="234">Model and checkpoints</text>
      <text x="625" y="224">Restricted file and</text>
      <text x="625" y="247">network access</text>
    </g>
  </g>
</svg>
