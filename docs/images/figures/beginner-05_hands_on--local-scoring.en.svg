<svg xmlns="http://www.w3.org/2000/svg" width="760px" height="204px" viewBox="0 0 760 204" role="img" aria-labelledby="title desc">
  <title id="title">Local grading test</title>
  <desc id="desc">pytest sends prepared answers to two CPU servers and checks their verdicts against expectations and each other.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#1d4e9e"/>
    </marker>
  </defs>
  <rect width="760" height="204" rx="14" fill="#fff"/>
  <g font-family="system-ui, 'Noto Sans KR', 'NanumGothic', sans-serif" text-anchor="middle" fill="#18263b">
    <rect x="24" y="28" width="192" height="148" rx="12" fill="#f5f7fb" stroke="#909fb3"/>
    <rect x="284" y="28" width="192" height="148" rx="12" fill="#edf4ff" stroke="#3765a8"/>
    <rect x="544" y="28" width="192" height="148" rx="12" fill="#f5f7fb" stroke="#909fb3"/>
    <g transform="translate(108.5 44) scale(0.958333)" fill="none" stroke="#3765a8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/></g>
    <g transform="translate(368.5 44) scale(0.958333)" fill="none" stroke="#3765a8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="7" rx="2"/><rect x="4" y="13" width="16" height="7" rx="2"/><path d="M7 7.5h.1M7 16.5h.1M12 7.5h5M12 16.5h5"/></g>
    <g transform="translate(628.5 44) scale(0.958333)" fill="none" stroke="#3765a8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8v4H8zM8 5H5v16h14V5h-3M8 14l3 3 5-6"/></g>
    <g font-size="22" font-weight="700">
      <text x="120" y="92">Test submissions</text><text x="380" y="92">CPU graders</text><text x="640" y="92">pytest checks</text>
    </g>
    <g font-size="17">
      <text x="120" y="120">Mixed outcomes</text><text x="120" y="144">Known verdicts</text>
      <text x="380" y="120">Two local servers</text><text x="380" y="144">Return a verdict</text>
      <text x="640" y="120">Match expectations</text><text x="640" y="144">Compare the servers</text>
    </g>
    <g fill="none" stroke="#1d4e9e" stroke-width="2" marker-end="url(#arrow)">
      <path d="M226 102 H274"/><path d="M486 102 H534"/>
    </g>
  </g>
</svg>
