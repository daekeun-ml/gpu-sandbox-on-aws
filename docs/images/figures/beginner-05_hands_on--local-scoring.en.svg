<svg xmlns="http://www.w3.org/2000/svg" width="500" height="266" viewBox="0 0 500 266" role="img" aria-labelledby="title desc">
  <title id="title">Test the grader with a wrong answer</title><desc id="desc">Submit a known wrong answer and check that both servers return the expected verdict.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5 0 10z" fill="#1f6fb2"/></marker></defs>
  <rect width="500" height="266" fill="#fff"/>
  <g font-family="Pretendard, 'Noto Sans KR', sans-serif" fill="#1f2328">
    <text x="14" y="31" font-size="23" font-weight="600">Test the grader with a wrong answer</text>
    <g stroke="#c3c8cf"><rect x="14" y="50" width="198" height="68" rx="8" fill="#f3f4f6"/><rect x="288" y="50" width="198" height="68" rx="8" fill="#e8f1fa"/></g>
    <g text-anchor="middle"><g font-size="19" font-weight="600"><text x="113" y="78">Test submission</text><text x="387" y="78">CPU grader</text></g><g font-size="16"><text x="113" y="102">Deliberately wrong code</text><text x="387" y="102">Runs the submission</text></g></g>
    <path d="M212 84H285" fill="none" stroke="#1f6fb2" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M387 118V143" fill="none" stroke="#1f6fb2" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="14" y="148" width="472" height="107" rx="8" fill="#fff" stroke="#c3c8cf"/>
    <g text-anchor="middle" font-size="17"><text x="113" y="176">Expected verdict</text><text x="387" y="176">Actual verdict</text></g>
    <g text-anchor="middle" font-family="monospace" font-size="18" font-weight="600"><text x="113" y="205">wrong_answer</text><text x="250" y="205">=</text><text x="387" y="205">wrong_answer</text></g>
    <text x="250" y="239" text-anchor="middle" font-size="16">This check passes when the two verdicts match.</text>
  </g>
</svg>
