<svg xmlns="http://www.w3.org/2000/svg" width="760px" height="412px" viewBox="0 0 760 412" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C23B32"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA1AB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g id="n:keep-v1"><rect x="320.4" y="16" width="119.2" height="46" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="380.0" y="35.18" font-size="13" fill="#1F2328" text-anchor="middle">keep v1</text><text x="380.0" y="52.18" font-size="12" fill="#1F2328" text-anchor="middle">v2 gets no traffic</text><path d="M380.0,124 L380.0,64" fill="none" stroke="#C23B32" stroke-width="1.6" marker-end="url(#head-red)"/><text x="386.0" y="80" font-size="12" fill="#C23B32" text-anchor="start">fail</text><rect x="8" y="94" width="744" height="106" rx="8" fill="none" stroke="#C3C8CF" stroke-width="1.2"/><g transform="translate(18,100) scale(0.625)" fill="#1F2328"><path d="M9.25 12a.75.75 0 0 1-.22.53l-2.75 2.75a.75.75 0 0 1-1.06-1.06L7.44 12 5.22 9.78a.75.75 0 1 1 1.06-1.06l2.75 2.75c.141.14.22.331.22.53m2 2a.75.75 0 0 0 0 1.5h5a.75.75 0 0 0 0-1.5z"/><path d="M0 4.75C0 3.784.784 3 1.75 3h20.5c.966 0 1.75.784 1.75 1.75v14.5A1.75 1.75 0 0 1 22.25 21H1.75A1.75 1.75 0 0 1 0 19.25Zm1.75-.25a.25.25 0 0 0-.25.25v14.5c0 .138.112.2