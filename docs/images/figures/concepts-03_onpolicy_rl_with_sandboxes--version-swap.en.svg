xt x="532.1999999999999" y="143.68" font-size="13" fill="#1F2328" text-anchor="middle">4. switch routing</text><text x="532.1999999999999" y="160.68" font-size="12" fill="#1F2328" text-anchor="middle">v2 from the next</text><text x="532.1999999999999" y="177.68" font-size="12" fill="#1F2328" text-anchor="middle">reward batch</text><path d="M591.8,156.0 L622.8,156.0" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><g id="n:step5"><rect x="624.8" y="124" width="119.2" height="64" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="684.4" y="143.68" font-size="13" fill="#1F2328" text-anchor="middle">5. --finish</text><text x="684.4" y="160.68" font-size="12" fill="#1F2328" text-anchor="middle">scale v1 to 0</text><text x="684.4" y="177.68" font-size="12" fill="#1F2328" text-anchor="middle">kept for rollback</text><rect x="8" y="238" width="744" height="106" rx="8" fill="none" stroke="#C3C8CF" stroke-width="1.2"/><g transform="translate(18,244) scale(0.625)" fill="#1F2328"><path d="M3.38 8A9.5 9.5 0 0 1 12 2.5a9.5 9.5 0 0 1 9.215 7.182.75.75 0 1 0 1.456-.364C21.473 4.539 17.15 1 12 1a11 11 0 0 0-9.5 5.452V4.75a.75.75 0 0 0-1.5 0V8.5a1 1 0 0 0 1 1h3.75a.75.75 0 0 0 0-1.5zm-.595 6.318a.75.75 0 0 0-1.455.364C2.527 19.461 6.85 23 12 23c4.052 0 7.592-2.191 9.5-5.451v1.701a.75.75 0 0 0 1.5 0V15.5a1 1 0 0 0-1-1h-3.75a.75.75 0 0 0 0 1.5h2.37A9.5 9.5 0 0 1 12 21.5c-4.446 0-8.181-3.055-9.215-7.182"/></g><text x="38" y="256" font-size="12" fill="#1F2328" text-anchor="start">trainer: a routing snapshot per sandbox call, one version per batch</text><g id="n:batch0"><rect x="16.0" y="272" width="94.83999999999999" height="36" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="63.419999999999995" y="294.68" font-size="13" fill="#1F2328" text-anchor="middle">v1 batch</text><g id="n:batch1"><rect x="118.83999999999999" y="272" width="94.83999999999999" height="36" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="166.26" y="294.68" font-size="13" fill="#1F2328" text-anchor="middle">v1 batch</text><g id="n:batch2"><rect x="221.67999999999998" y="272" width="94.83999999999999" height="36" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="269.09999999999997" y="294.68" font-size="13" fill="#1F2328" text-anchor="middle">v1 batch</text><g id="n:batch3"><rect x="324.52" y="272" width="94.83999999999999" height="36" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="371.94" y="294.68" font-size="13" fill="#1F2328" text-anchor="middle">v1 batch</text><g id="n:batch4"><rect x="427.35999999999996" y="272" width="94.83999999999999" height="36" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="474.78" y="294.68" font-size="13" fill="#1F2328" text-anchor="middle">v1 batch</text><g id="n:batch5"><rect x="542.1999999999999" y="272" width="94.83999999999999" height="36" rx="6" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/></g><text x="589.6199999999999" y="294.68" font-size="13" fill="#1F2328" text-anchor="middle">v2 batch</text><g id="n:batch6"><rect x="645.04" y="272" width="94.83999999999999" height="36" rx="6" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/></g><text x="692.4599999999999" y="294.68" font-size="13" fill="#1F2328" text-anchor="middle">v2 batch</text><text x="520.1999999999999" y="330" font-size="12" fill="#1F2328" text-anchor="end">first switch: a batch sent to v1 ends on v1</text><text x="544.1999999999999" y="330" font-size="12" fill="#1F2328" text-anchor="start">logs sandbox_version_switch</text><path d="M532.1999999999999,190 L532.1999999999999,336" fill="none" stroke="#1F6FB2" stroke-width="1.6" stroke-dasharray="5 4"/><text x="540.1999999999999" y="223.0" font-size="12" fill="#1F2328" text-anchor="start">reaches pods within about a minute</text><path d="M16,366 L744,366" fill="none" stroke="#9AA1AB" stroke-width="1.6" marker-end="url(#head-muted)"/><text x="744" y="386" font