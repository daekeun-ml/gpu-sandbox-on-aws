<rect x="25" y="228" width="280" height="68" rx="10" fill="#f8fafc" stroke="#a4afbf"/>
    <g transform="translate(42 248)" fill="none" stroke="#3765a8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/><path d="M9 12l2 2 4-4"/></g>
    <text x="78" y="257" font-size="16" font-weight="700">Separate VM required</text>
    <text x="78" y="278" font-size="13">Check the isolation requirement</text>
<rect x="25" y="345" width="280" height="68" rx="10" fill="#edf4ff" stroke="#3765a8"/>
    <g transform="translate(42 365)" fill="none" stroke="#3765a8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h14"/><circle cx="9" cy="6" r="2" fill="white"/><circle cx="15" cy="12" r="2" fill="white"/><circle cx="10" cy="18" r="2" fill="white"/></g>
    <text x="78" y="374" font-size="16" font-weight="700">gVisor candidate</text>
    <text x="78" y="395" font-size="13">Check driver support</text>
<rect x="475" y="345" width="280" height="68" rx="10" fill="#edf4ff" stroke="#3765a8"/>
    <g transform="translate(492 365)" fill="none" stroke="#3765a8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><rect x="8" y="9" width="8" height="6" rx="1"/></g>
