<svg xmlns="http://www.w3.org/2000/svg" width="780px" height="309px" viewBox="0 0 780 309" role="img" aria-labelledby="title desc">
  <title id="title">Training data in on-policy and offline RL</title>
  <desc id="desc">On-policy uses answers from model A to update A, then model B generates fresh answers. Offline RL updates the model using a previously collected dataset.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#3765a8"/>
    </marker>
  </defs>
  <rect width="780" height="309" rx="14" fill="#fff"/>
  <path d="M24 156 H756" stroke="#d2dae5"/>
  <g font-family="system-ui, 'Noto Sans KR', 'NanumGothic', sans-serif" fill="#18263b">
    <text x="24" y="31" font-size="19" font-weight="700">On-policy RL</text>
    <text x="24" y="53" font-size="14">Generate from the current model</text>
    <rect x="24" y="67" width="119" height="70" rx="8" fill="#edf4ff" stroke="#3765a8"/>
    <g transform="translate(74.5 74) scale(0.75)" fill="none" stroke="#3765a8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7l6-3 6 3v10l-6 3-6-3zM6 7l6 3 6-3M12 10v10"/></g>
    <text x="83.5" y="109" text-anchor="middle" font-size="15" font-weight="700">Model A</text>
    <text x="83.5" y="126" text-anchor="middle" font-size="13">Current weights</text>
    <path d="M147 102 h26" stroke="#3765a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="177" y="67" width="119" height="70" rx="8" fill="#f8fafc" stroke="#a4afbf"/>
    <text x="236.5" y="96" text-anchor="middle" font-size="15" font-weight="700">A’s answers</text>
    <text x="236.5" y="119" text-anchor="middle" font-size="13">Generate now</text>
    <path d="M300 102 h26" stroke="#3765a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="330" y="67" width="119" height="70" rx="8" fill="#f8fafc" stroke="#a4afbf"/>
    <text x="389.5" y="96" text-anchor="middle" font-size="15" font-weight="700">Reward</text>
    <text x="389.5" y="119" text-anchor="middle" font-size="13">Sandbox grades</text>
    <path d="M453 102 h26" stroke="#3765a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="483" y="67" width="119" height="70" rx="8" fill="#edf4ff" stroke="#3765a8"/>
    <g transform="translate(533.5 74) scale(0.75)" fill="none" stroke="#3765a8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7l6-3 6 3v10l-6 3-6-3zM6 7l6 3 6-3M12 10v10"/></g>
    <text x="542.5" y="109" text-anchor="middle" font-size="15" font-weight="700">Model B</text>
    <text x="542.5" y="126" text-anchor="middle" font-size="13">Update A</text>
    <path d="M606 102 h26" stroke="#3765a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="636" y="67" width="119" height="70" rx="8" fill="#f8fafc" stroke="#a4afbf"/>
    <text x="695.5" y="96" text-anchor="middle" font-size="15" font-weight="700">B’s next answers</text>
    <text x="695.5" y="119" text-anchor="middle" font-size="13">Generate again</text>
    <text x="24" y="180" font-size="19" font-weight="700">Offline RL</text>
    <text x="24" y="202" font-size="14">Train from previously collected data</text>
    <rect x="24" y="216" width="221" height="70" rx="8" fill="#f8fafc" stroke="#a4afbf"/>
    <text x="134.5" y="245" text-anchor="middle" font-size="15" font-weight="700">Collect in advance</text>
    <text x="134.5" y="268" text-anchor="middle" font-size="13">Answers and evaluations</text>
    <path d="M249 251 h26" stroke="#3765a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="279" y="216" width="221" height="70" rx="8" fill="#edf4ff" stroke="#3765a8"/>
    <g transform="translate(380.5 223) scale(0.75)" fill="none" stroke="#3765a8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
    <text x="389.5" y="258" text-anchor="middle" font-size="15" font-weight="700">Fixed dataset</text>
    <text x="389.5" y="275" text-anchor="middle" font-size="13">Store collected records</text>
    <path d="M504 251 h26" stroke="#3765a8" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="534" y="216" width="221" height="70" rx="8" fill="#f8fafc" stroke="#a4afbf"/>
    <g transform="translate(635.5 223) scale(0.75)" fill="none" stroke="#3765a8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7l6-3 6 3v10l-6 3-6-3zM6 7l6 3 6-3M12 10v10"/></g>
    <text x="644.5" y="258" text-anchor="middle" font-size="15" font-weight="700">Model updates</text>
    <text x="644.5" y="275" text-anchor="middle" font-size="13">Train on stored records</text>
  </g>
</svg>
