<svg xmlns="http://www.w3.org/2000/svg" width="760px" height="534px" viewBox="0 0 760 534" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C23B32"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA1AB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g id="n:server"><rect x="32" y="14" width="260" height="46" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><g transform="translate(85.5,27.0) scale(0.8333333333333334)" fill="#1F2328"><path d="M10.75 6.5a.75.75 0 0 0 0 1.5h6.5a.75.75 0 0 0 0-1.5zM6 7.25a.75.75 0 0 1 .75-.75h.5a.75.75 0 0 1 0 1.5h-.5A.75.75 0 0 1 6 7.25m4 9a.75.75 0 0 1 .75-.75h6.5a.75.75 0 0 1 0 1.5h-6.5a.75.75 0 0 1-.75-.75m-3.25-.75a.75.75 0 0 0 0 1.5h.5a.75.75 0 0 0 0-1.5z"/><path d="M3.25 2h17.5c.966 0 1.75.784 1.75 1.75v7c0 .372-.116.716-.314 1 .198.284.314.628.314 1v7a1.75 1.75 0 0 1-1.75 1.75H3.25a1.75 1.75 0 0 1-1.75-1.75v-7c0-.358.109-.707.314-1a1.74 1.74 0 0 1-.314-1v-7C1.5 2.784 2.284 2 3.25 2m0 10.5a.25.25 0 0 0-.25.25v7c0 .138.112.25.25.25h17.5a.25.25 0 0 0 .25-.25v-7a.25.25 0 0 0-.25-.25Zm0-1.5h17.5a.25.25 0 0 0 .25-.25v-7a.25.25 0 0 0-.25-.25H3.25a.25.25 0 0 0-.25.25v7c0 .138.112.25.25.25"/></g><text x="177.0" y="34.0" font-size="13" fill="#1F2328" text-anchor="middle">샌드박스 서버 (uvicorn)</text><text x="177.0" y="51.0" font-size="12" fill="#1F2328" text-anchor="middle">torch import 없음</text><path d="M162.0,60 L162.0,92" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><text x="170.0" y="81" font-size="12" fill="#1F2328" text-anchor="start">요청마다 새 프로세스</text><rect x="16" y="92" width="292" height="428" rx="8" fill="none" stroke="#C3C8CF" stroke-width="1.2"/><text x="26" y="110" font-size="12" font-weight="600" fill="#1F2328" text-anchor="start">신뢰하는 부모: evaluate.py</text><g id="n:step1"><rect x="32" y="122" width="260" height="46" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="162.0" y="142.0" font-size="13" fill="#1F2328" text-anchor="middle">1. 정적 정책 (AST)</text><text x="162.0" y="159.0" font-size="12" fill="#1F2328" text-anchor="middle">check_source</text><g id="n:step2"><rect x="32" y="190" width="260" height="46" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="162.0" y="210.0" font-size="13" fill="#1F2328" text-anchor="middle">2. 요청마다 새 seed</text><text x="162.0" y="227.0" font-size="12" fill="#1F2328" text-anchor="middle">정확성 seed, timing seed</text><g id="n:step4"><rect x="32" y="320" width="260" height="46" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="162.0" y="340.0" font-size="13" fill="#1F2328" text-anchor="middle">4. reference 출력과 비교</text><text x="162.0" y="357.0" font-size="12" fill="#1F2328" text-anchor="middle">같은 seed, weights_only=True로 읽기</text><g id="n:step5"><rect x="32" y="388" width="260" height="46" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="162.0" y="408.0" font-size="13" fill="#1F2328" text-anchor="middle">5. reference timing</text><text x="162.0" y="425.0" font-size="12" fill="#1F2328" text-anchor="middle">timed 출력 checksum 비교</text><g id="n:step6"><rect x="32" y="456" width="260" height="46" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="162.0" y="476.0" font-size="13" fill="#1F2328" text-anchor="middle">6. verdict JSON 작성</text><text x="162.0" y="493.0" font-size="12" fill="#1F2328" text-anchor="middle">runner.py가 끝난 뒤 마지막에</text><path d="M162.0,168 L162.0,188" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><path d="M162.0,366 L162.0,386" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><path d="M162.0,434 L162.0,454" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><rect x="468" y="156" width="276" height="318" rx="8" fill="none" stroke="#1F6FB2" stroke-width="1.2"/><g transform="translate(478,162) scale(0.625)" fill="#1F6FB2"><path d="M11.46 1.137a1.75 1.75 0 0 1 1.08 0l8.25 2.675A1.75 1.75 0 0 1 22 5.476V10.5c0 6.19-3.77 10.705-9.401 12.83a1.7 1.7 0 0 1-1.198 0C5.771 21.204 2 16.69 2 10.5V5.476c0-.76.49-1.43 1.21-1.664Zm.617 1.426a.25.25 0 0 0-.154 0L3.673 5.24a.25.25 0 0 0-.173.237V10.5c0 5.461 3.28 9.483 8.43 11.426a.2.2 0 0 0 .14 0c5.15-1.943 8.43-5.965 8.43-11.426V5.476a.25.25 0 0 0-.173-.237ZM13 12.232V15a1 1 0 0 1-2 0v-2.768a2 2 0 1 1 2 0"/></g><text x="498" y="174" font-size="12" font-weight="600" fill="#1F6FB2" text-anchor="start">신뢰하지 않는 자식: runner.py</text><g id="n:step3"><rect x="484" y="190" width="244" height="46" rx="6" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/></g><text x="606.0" y="210.0" font-size="13" fill="#1F2328" text-anchor="middle">3. 후보 ModelNew 실행</text><text x="606.0" y="227.0" font-size="12" fill="#1F2328" text-anchor="middle">seed별 출력 저장</text><g id="n:step3b"><rect x="484" y="320" width="244" height="46" rx="6" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/></g><text x="606.0" y="340.0" font-size="13" fill="#1F2328" text-anchor="middle">timing, checksum</text><text x="606.0" y="357.0" font-size="12" fill="#1F2328" text-anchor="middle">runner.json 작성</text><g id="n:never"><rect x="484" y="410" width="244" height="46" rx="6" fill="#FFFFFF" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="606.0" y="430.0" font-size="13" fill="#1F2328" text-anchor="middle">자식에게 없는 것</text><text x="606.0" y="447.0" font-size="12" fill="#1F2328" text-anchor="middle">reference 출력, 토큰 같은 pod env</text><path d="M606.0,236 L606.0,318" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><path d="M292,213.0 L482,213.0" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><text x="388.0" y="205.0" font-size="12" fill="#1F2328" text-anchor="middle">후보 코드, seed</text><text x="388.0" y="231.0" font-size="12" fill="#1F2328" text-anchor="middle">env allowlist,</text><text x="388.0" y="246.0" font-size="12" fill="#1F2328" text-anchor="middle">새 session, timeout</text><path d="M484,343.0 L294,343.0" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><text x="388.0" y="320.0" font-size="12" fill="#1F2328" text-anchor="middle">seed별 출력,</text><text x="388.0" y="335.0" font-size="12" fill="#1F2328" text-anchor="middle">runner.json</text><text x="388.0" y="361.0" font-size="12" fill="#1F2328" text-anchor="middle">runner.json은</text><text x="388.0" y="376.0" font-size="12" fill="#1F2328" text-anchor="middle">1 MiB 제한, 타입 검사</text></svg>
