<svg xmlns="http://www.w3.org/2000/svg" width="760px" height="475px" viewBox="0 0 760 475" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C23B32"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA1AB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><g id="n:A"><rect x="16" y="28.0" width="196" height="40" rx="6" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/></g><text x="114.0" y="52.68" font-size="13" fill="#1F2328" text-anchor="middle">샌드박스 안에서 GPU 필요</text><g id="n:B"><rect x="272" y="28.0" width="140" height="40" rx="6" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/></g><text x="342.0" y="52.68" font-size="13" fill="#1F2328" text-anchor="middle">관리형 서비스 선호</text><g id="n:C"><rect x="16" y="167.0" width="196" height="40" rx="6" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/></g><text x="114.0" y="191.68" font-size="13" fill="#1F2328" text-anchor="middle">관리형 GPU 샌드박스 선호</text><g id="n:D"><rect x="16" y="253.0" width="196" height="47" rx="6" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/></g><text x="114.0" y="272.68" font-size="13" fill="#1F2328" text-anchor="middle">VM 경계 필요</text><text x="114.0" y="289.68" font-size="12" fill="#1F2328" text-anchor="middle">(서로 다른 고객의 적대적 코드)</text><g id="n:E"><rect x="16" y="337.5" width="196" height="40" rx="6" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.2"/></g><text x="114.0" y="362.18" font-size="13" fill="#1F2328" text-anchor="middle">T4에서 측정한 timing으로 충분</text><g id="n:B1"><rect x="452" y="16.0" width="292" height="64" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="598.0" y="35.68" font-size="13" fill="#1F2328" text-anchor="middle">AgentCore Code Interpreter 또는</text><text x="598.0" y="52.68" font-size="12" fill="#1F2328" text-anchor="middle">Nitro Sandboxes, EKS isolated pods</text><text x="598.0" y="69.68" font-size="12" fill="#1F2328" text-anchor="middle">(CPU 전용)</text><g id="n:B2"><rect x="452" y="94.0" width="292" height="47" rx="6" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/></g><text x="598.0" y="113.68" font-size="13" fill="#1F2328" text-anchor="middle">Kata + CLH on c8i</text><text x="598.0" y="130.68" font-size="12" fill="#1F2328" text-anchor="middle">(nested virtualization)</text><g id="n:C1"><rect x="452" y="155.0" width="292" height="64" rx="6" fill="#F3F4F6" stroke="#9AA1AB" stroke-width="1.2"/></g><text x="598.0" y="174.68" font-size="13" fill="#1F2328" text-anchor="middle">서드파티 서비스</text><text x="598.0" y="191.68" font-size="12" fill="#1F2328" text-anchor="middle">(예: Modal, gVisor 기반)</text><text x="598.0" y="208.68" font-size="12" fill="#1F2328" text-anchor="middle">이 에셋 범위 밖</text><g id="n:F"><rect x="452" y="253.0" width="292" height="47" rx="6" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/></g><text x="598.0" y="272.68" font-size="13" fill="#1F2328" text-anchor="middle">gVisor + nvproxy on G/P 계열 VM</text><text x="598.0" y="289.68" font-size="12" fill="#1F2328" text-anchor="middle">g5 (A10G), g6 (L4), g6e (L40S), p5 (H100)</text><g id="n:E1"><rect x="452" y="334.0" width="292" height="47" rx="6" fill="#E8F1FA" stroke="#1F6FB2" stroke-width="1.2"/></g><text x="598.0" y="353.68" font-size="13" fill="#1F2328" text-anchor="middle">Kata + QEMU on g4dn.metal</text><text x="598.0" y="370.68" font-size="12" fill="#1F2328" text-anchor="middle">VM 경계 + VFIO</text><g id="n:E2"><rect x="452" y="395.0" width="292" height="64" rx="6" fill="#FBEAE8" stroke="#C23B32" stroke-width="1.2"/></g><text x="598.0" y="414.68" font-size="13" fill="#C23B32" text-anchor="middle">EC2에 없는 VM 경계 + 최신 GPU 조합</text><text x="598.0" y="431.68" font-size="12" fill="#C23B32" text-anchor="middle">gVisor + 보완 통제로 위험을 수용하거나</text><text x="598.0" y="448.68" font-size="12" fill="#C23B32" text-anchor="middle">요구 사항을 다시 검토</text><path d="M212,48.0 L270,48.0" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><text x="242.0" y="40.0" font-size="12" fill="#1F2328" text-anchor="middle">아니오</text><path d="M412,48.0 L450,48.0" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><text x="432.0" y="40.0" font-size="12" fill="#1F2328" text-anchor="middle">예</text><path d="M342.0,68.0 L342.0,117.5 L450,117.5" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><text x="348.0" y="96.75" font-size="12" fill="#1F2328" text-anchor="start">아니오</text><path d="M114.0,68.0 L114.0,165.0" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><text x="120.0" y="121.5" font-size="12" fill="#1F2328" text-anchor="start">예</text><path d="M212,187.0 L450,187.0" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><text x="332.0" y="179.0" font-size="12" fill="#1F2328" text-anchor="middle">예</text><path d="M114.0,207.0 L114.0,251.0" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><text x="120.0" y="234.0" font-size="12" fill="#1F2328" text-anchor="start">아니오</text><path d="M212,276.5 L450,276.5" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><text x="332.0" y="268.5" font-size="12" fill="#1F2328" text-anchor="middle">아니오</text><path d="M114.0,300.0 L114.0,335.5" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><text x="120.0" y="322.75" font-size="12" fill="#1F2328" text-anchor="start">예</text><path d="M212,357.5 L450,357.5" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><text x="332.0" y="349.5" font-size="12" fill="#1F2328" text-anchor="middle">예</text><path d="M114.0,377.5 L114.0,427.0 L450,427.0" fill="none" stroke="#1F2328" stroke-width="1.6" marker-end="url(#head-ink)"/><text x="120.0" y="406.25" font-size="12" fill="#1F2328" text-anchor="start">아니오</text></svg>
