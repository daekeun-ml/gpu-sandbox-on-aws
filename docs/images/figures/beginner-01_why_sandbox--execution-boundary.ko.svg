<svg xmlns="http://www.w3.org/2000/svg" width="760px" height="296px" viewBox="0 0 760 296" role="img" aria-labelledby="title description">
  <title id="title">학습 환경과 샌드박스의 실행 경계</title>
  <desc id="description">학습 프로그램은 모델과 체크포인트를 관리합니다. 답안과 과제 ID를 샌드박스에 보내면 샌드박스가 답안을 실행하고 채점 결과를 돌려줍니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4e9e"/>
    </marker>
  </defs>
  <rect width="760" height="296" rx="14" fill="#fff"/>
  <g font-family="system-ui, 'Noto Sans KR', 'NanumGothic', sans-serif" fill="#18263b" text-anchor="middle">
    <rect x="24" y="24" width="222" height="248" rx="12" fill="#f5f7fb" stroke="#909fb3"/>
    <rect x="514" y="24" width="222" height="248" rx="12" fill="#edf4ff" stroke="#3765a8" stroke-width="2"/>
    <g font-size="22" font-weight="700">
      <text x="135" y="61">학습 환경</text>
      <text x="625" y="61">샌드박스</text>
    </g>
    <g fill="#fff" stroke="#a1aec1">
      <rect x="46" y="86" width="178" height="104" rx="9"/>
      <rect x="536" y="86" width="178" height="104" rx="9"/>
    </g>
    <g transform="translate(123.5 96) scale(0.958333)" fill="none" stroke="#3765a8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7l6-3 6 3v10l-6 3-6-3zM6 7l6 3 6-3M12 10v10"/></g>
    <g transform="translate(613.5 96) scale(0.958333)" fill="none" stroke="#3765a8" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6zM9 12l2 2 4-4"/></g>
    <g font-size="19">
      <text x="135" y="153">학습 프로그램</text>
      <text x="625" y="153">제출 코드 실행</text>
    </g>
    <g stroke="#1d4e9e" stroke-width="2" marker-end="url(#arrow)">
      <path d="M 224 118 H 532"/>
      <path d="M 536 165 H 228"/>
    </g>
    <g font-size="17">
      <text x="380" y="106">답안과 과제 ID</text>
      <text x="380" y="153">채점 결과</text>
      <text x="135" y="234">모델과 체크포인트 관리</text>
      <text x="625" y="224">파일과 네트워크를 제한한</text>
      <text x="625" y="247">환경에서 계산</text>
    </g>
  </g>
</svg>
