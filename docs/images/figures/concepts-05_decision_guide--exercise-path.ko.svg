<svg xmlns="http://www.w3.org/2000/svg" width="780px" height="438px" viewBox="0 0 780 438" role="img" aria-labelledby="title desc">
  <title id="title">GPU 샌드박스 실습 경로 선택</title><desc id="desc">채점에 필요한 GPU, 측정할 장치, VM 격리 경계를 차례로 정하는 흐름.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#3765a8"/></marker></defs>
  <rect width="780" height="438" rx="14" fill="#fff"/>
  <g fill="none" stroke="#3765a8" stroke-width="2" marker-end="url(#arrow)">
    <path d="M305 58 H470"/><path d="M165 92 V121"/><path d="M165 194 V223"/><path d="M165 296 V340"/><path d="M305 262 H615 V340"/>
  </g>
  <g font-family="system-ui, 'Noto Sans KR', 'NanumGothic', sans-serif" fill="#18263b">
    <rect x="25" y="24" width="280" height="68" rx="10" fill="#f8fafc" stroke="#a4afbf"/>
    <g transform="translate(42 44)" fill="none" stroke="#3765a8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="6" width="14" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M2 9h3M2 15h3M19 9h3M19 15h3"/></g>
    <text x="78" y="53" font-size="16" font-weight="700">채점에 GPU가 필요한지 확인</text>
    <text x="78" y="74" font-size="13">CPU 테스트로 충분한지 판단</text>
<rect x="475" y="24" width="280" height="68" rx="10" fill="#edf4ff" stroke="#3765a8"/>
    <g transform="translate(492 44)" fill="none" stroke="#3765a8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 3v3m6-3v3m-6 12v3m6-3v3M3 9h3m-3 6h3m12-6h3m-3 6h3"/></g>
    <text x="528" y="53" font-size="16" font-weight="700">CPU 실습</text>
    <text x="528" y="74" font-size="13">기준 답안의 판정 확인</text>
<rect x="25" y="126" width="280" height="68" rx="10" fill="#f8fafc" stroke="#a4afbf"/>
    <g transform="translate(42 146)" fill="none" stroke="#3765a8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M12 11v2"/></g>
    <text x="78" y="155" font-size="16" font-weight="700">측정할 GPU와 입력 결정</text>
    <text x="78" y="176" font-size="13">실제로 배포할 장치에서 측정</text>
<rect x="25" y="228" width="280" height="68" rx="10" fill="#f8fafc" stroke="#a4afbf"/>
    <g transform="translate(42 248)" fill="none" stroke="#3765a8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/><path d="M9 12l2 2 4-4"/></g>
    <text x="78" y="257" font-size="16" font-weight="700">별도 VM 경계가 필요한지 확인</text>
    <text x="78" y="278" font-size="13">요구하는 격리 수준을 적용</text>
<rect x="25" y="345" width="280" height="68" rx="10" fill="#edf4ff" stroke="#3765a8"/>
    <g transform="translate(42 365)" fill="none" stroke="#3765a8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h14"/><circle cx="9" cy="6" r="2" fill="white"/><circle cx="15" cy="12" r="2" fill="white"/><circle cx="10" cy="18" r="2" fill="white"/></g>
    <text x="78" y="374" font-size="16" font-weight="700">gVisor 후보</text>
    <text x="78" y="395" font-size="13">드라이버 지원 확인</text>
<rect x="475" y="345" width="280" height="68" rx="10" fill="#edf4ff" stroke="#3765a8"/>
    <g transform="translate(492 365)" fill="none" stroke="#3765a8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><rect x="8" y="9" width="8" height="6" rx="1"/></g>
    <text x="528" y="374" font-size="16" font-weight="700">Kata 후보</text>
    <text x="528" y="395" font-size="13">GPU passthrough 지원 확인</text>
    <g font-size="13"><text x="374" y="48">아니요</text><text x="177" y="112">예</text><text x="177" y="322">아니요</text><text x="460" y="252">예</text></g>
  </g>
</svg>
