<svg xmlns="http://www.w3.org/2000/svg" width="524px" height="280px" viewBox="0 0 524 280" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif"><defs><marker id="head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2328"/></marker><marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C23B32"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F6FB2"/></marker><marker id="head-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9AA1AB"/></marker></defs><rect width="100%" height="100%" fill="#FFFFFF"/><text x="16" y="31" font-size="23" font-weight="600" fill="#1F2328" text-anchor="start">현재 모델이 만든 답으로 학습하는 과정</text><rect x="16" y="58" width="189" height="62" rx="6" fill="#F3F4F6" stroke="#C3C8CF" stroke-width="1.2"/><text x="110.5" y="86" font-size="17" font-weight="600" fill="#1F2328" text-anchor="middle">현재 모델</text><text x="110.5" y="107" font-size="16" fill="#1F2328" text-anchor="middle">같은 문제에 답 두 개 작성</text><rect x="316" y="58" width="191" height="62" rx="6" fill="#E8F1FA" stroke="#C3C8CF" stroke-width="1.2"/><text x="411.5" y="86" font-size="17" font-weight="600" fill="#1F2328" text-anchor="middle">샌드박스</text><text x="411.5" y="107" font-size="16" fill="#1F2328" text-anchor="middle">두 답을 각각 실행</text><rect x="16" y="202" width="189" height="62" rx="6" fill="#F3F4F6" stroke="#C3C8CF" stroke-width="1.2"/><text x="110.5" y="230" font-size="17" font-weight="600" fill="#1F2328" text-anchor="middle">학습 프로그램</text><text x="110.5" y="251" font-size="16" fill="#1F2328" text-anchor="middle">답마다 보상 계산</text><path d="M205,92 L313,92" fill="none" stroke="#1F6FB2" stroke-width="2" marker-end="url(#head-accent)"/><text x="260" y="81" font-size="16" fill="#1F2328" text-anchor="middle">코드 제출</text><path d="M412,120 L412,233 L208,233" fill="none" stroke="#1F6FB2" stroke-width="2" marker-end="url(#head-accent)"/><text x="311" y="218" font-size="16" fill="#1F2328" text-anchor="middle">정답 여부와 실행 시간</text><path d="M110,202 L110,123" fill="none" stroke="#1F6FB2" stroke-width="2" marker-end="url(#head-accent)"/><text x="124" y="166" font-size="16" fill="#1F2328" text-anchor="start">보상으로 모델 조정</text></svg>
