# gVisor on the CPU sandbox node (scenario C and the CPU tier). Same containerd handler
# (runsc) as the GPU RuntimeClass, but scheduled onto the nested-virtualization node, where
# runsc runs without nvproxy. gVisor itself needs no KVM: it uses the systrap platform.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor-cpu
handler: runsc
scheduling:
  nodeSelector:
    gpusandbox/role: sandbox-kata
    gpusandbox/kata-gpu: "false"
  tolerations:
    - key: gpusandbox/role
      operator: Equal
      value: sandbox-kata
      effect: NoSchedule
