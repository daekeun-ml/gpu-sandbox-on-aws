# gVisor on the HyperPod sandbox instance group (scenario B2). Same containerd handler (runsc)
# as the EC2 RuntimeClass; the lifecycle script of that instance group registers it
# (infra/hyperpod/lifecycle/on_create_sandbox.sh). The label and taint come from the instance
# group's KubernetesConfig (infra/hyperpod/instance-group-sandbox.json.tpl).
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor-hyperpod
handler: runsc
scheduling:
  nodeSelector:
    gpusandbox/role: sandbox-hyperpod
  tolerations:
    - key: gpusandbox/role
      operator: Equal
      value: sandbox-hyperpod
      effect: NoSchedule
