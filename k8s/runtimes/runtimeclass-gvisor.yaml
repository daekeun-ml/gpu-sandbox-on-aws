# gVisor RuntimeClass. The handler name must match the containerd runtime declared in the
# node's NodeConfig (RUNSC_HANDLER in infra/eks/userdata.py): runtimes.runsc.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
scheduling:
  nodeSelector:
    gpusandbox/role: sandbox-gvisor
  tolerations:
    - key: gpusandbox/role
      operator: Equal
      value: sandbox-gvisor
      effect: NoSchedule
