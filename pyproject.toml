[project]
name = "gpusandbox"
version = "0.1.1"
description = "GPU reward sandboxes (gVisor, Kata + Cloud Hypervisor, Kata + QEMU) for on-policy RL on Amazon EKS and SageMaker HyperPod"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
# The core package has no hard dependencies: the sandbox image, the trainer image and the
# gateway image each install only the extra they need.
dependencies = []

[project.optional-dependencies]
# Sandbox image: HTTP server + harness. torch and triton come from the base image.
server = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
    "pyjwt[crypto]>=2.9",
]
# Trainer side: routing + async HTTP client.
client = [
    "httpx>=0.27",
]
# Production sandbox gateway.
gateway = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pyjwt[crypto]>=2.9",
    "kubernetes>=31.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
    # EpisodeSandbox.release() imports kubernetes.client.exceptions even with a fake API.
    "kubernetes>=31.0",
]

[project.scripts]
gpusandbox-server = "gpusandbox.server.app:main"
gpusandbox-gateway = "gpusandbox.gateway.app:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpusandbox"]

[dependency-groups]
docs = [
    "mkdocs-material>=9.7",
    "mkdocs-static-i18n>=1.3",
    "mkdocs-glightbox>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: spawns real harness subprocesses (CPU torch)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
