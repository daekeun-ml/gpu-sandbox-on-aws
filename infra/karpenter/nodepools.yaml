# Karpenter v1 NodePools (production track). Sandbox pools scale from zero and back.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: sandbox-gvisor
spec:
  template:
    metadata:
      labels:
        gpusandbox/role: sandbox-gvisor
        gpusandbox/device-plugin: cdi
        nvidia.com/gpu.deploy.operands: "false"
    spec:
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: sandbox-gvisor}
      taints:
        - {key: gpusandbox/role, value: sandbox-gvisor, effect: NoSchedule}
      requirements:
        # One GPU per node keeps one sandbox per node and per-GPU timing clean. Stay on GPU
        # families whose AMI driver nvproxy supports: g5 runs the proprietary module with GSP
        # off (verified with nvproxy in this repo), g6 the open module (documented by gVisor).
        # Check before adding more families.
        - {key: node.kubernetes.io/instance-type, operator: In, values: ["g5.xlarge", "g5.2xlarge"]}
        - {key: karpenter.sh/capacity-type, operator: In, values: ["on-demand"]}
      expireAfter: 720h
  limits:
    nvidia.com/gpu: "16"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 10m
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: sandbox-kata-gpu
spec:
  template:
    metadata:
      labels:
        gpusandbox/role: sandbox-kata
        gpusandbox/kata-gpu: "true"
        nvidia.com/gpu.workload.config: vm-passthrough
    spec:
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: sandbox-kata-gpu}
      taints:
        - {key: gpusandbox/role, value: sandbox-kata, effect: NoSchedule}
      requirements:
        - {key: node.kubernetes.io/instance-type, operator: In, values: ["g4dn.metal"]}
        - {key: karpenter.sh/capacity-type, operator: In, values: ["on-demand"]}
      expireAfter: 720h
  limits:
    cpu: "192"   # two g4dn.metal
  disruption:
    # Bare metal joins slowly; keep an empty node for a while before giving it back.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30m
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: sandbox-kata-cpu
spec:
  template:
    metadata:
      labels:
        gpusandbox/role: sandbox-kata
        gpusandbox/kata-gpu: "false"
    spec:
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: sandbox-kata-cpu}
      taints:
        - {key: gpusandbox/role, value: sandbox-kata, effect: NoSchedule}
      requirements:
        - {key: karpenter.k8s.aws/instance-family, operator: In, values: ["c8i", "m8i", "r8i"]}
        - {key: karpenter.k8s.aws/instance-size, operator: In, values: ["2xlarge", "4xlarge", "8xlarge"]}
        - {key: karpenter.sh/capacity-type, operator: In, values: ["on-demand", "spot"]}
      expireAfter: 336h
  limits:
    cpu: "256"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: trainer
spec:
  template:
    metadata:
      labels:
        gpusandbox/role: trainer
        gpusandbox/device-plugin: cdi
        nvidia.com/gpu.deploy.operands: "false"
    spec:
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: trainer}
      taints:
        - {key: gpusandbox/role, value: trainer, effect: NoSchedule}
      requirements:
        - {key: node.kubernetes.io/instance-type, operator: In, values: ["g6e.12xlarge", "g6e.48xlarge", "p5.48xlarge"]}
        - {key: karpenter.sh/capacity-type, operator: In, values: ["on-demand"]}
      expireAfter: 720h
  limits:
    nvidia.com/gpu: "16"
  disruption:
    # Never consolidate a node that is training; RayCluster pods also carry do-not-disrupt.
    consolidationPolicy: WhenEmpty
    consolidateAfter: 15m
