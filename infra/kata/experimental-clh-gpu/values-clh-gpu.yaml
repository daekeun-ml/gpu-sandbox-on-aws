# EXPERIMENTAL, NOT SUPPORTED UPSTREAM (as of Kata 4.3.1, 2026-11).
#
# Kata + Cloud Hypervisor + NVIDIA GPU passthrough. Upstream lists GPU support for Cloud
# Hypervisor as unsupported, the maintainers recommend the QEMU NVIDIA runtime class, and no
# CI covers this path. The Go CLH shim does have VFIO cold-plug code (since 3.29.0) that is
# disabled in the shipped configuration. Use this only to evaluate; keep kata-qemu-nvidia-gpu
# for anything that matters.
#
# Apply on top of the main values:
#   helm upgrade kata-deploy oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy \
#     --version 4.3.1 -n kube-system \
#     -f infra/kata/kata-deploy-values.yaml -f infra/kata/experimental-clh-gpu/values-clh-gpu.yaml
#
# Before applying, replace the two artifact paths below. Cloud Hypervisor boots an
# uncompressed vmlinux, while the NVIDIA guest kernel that kata-deploy ships for QEMU may only
# exist compressed. List what the node has with:
#   kubectl debug node/<kata-node> -it --image=public.ecr.aws/amazonlinux/amazonlinux:2023 \
#     -- ls -l /host/opt/kata/share/kata-containers/
# Then run infra/kata/experimental-clh-gpu/check-clh-gpu.sh to see whether CUDA initialises.
customRuntimes:
  enabled: true
  runtimes:
    clh-nvidia-gpu:
      baseConfig: "clh"
      dropIn: |
        [hypervisor.clh]
        kernel = "/opt/kata/share/kata-containers/__NVIDIA_GUEST_VMLINUX__"
        image = "/opt/kata/share/kata-containers/__NVIDIA_GUEST_IMAGE__"
        kernel_params = "cgroup_no_v1=all pci=realloc pci=nocrs pci=assign-busses"
        cold_plug_vfio = "root-port"
        default_memory = 8192
        [runtime]
        static_sandbox_resource_mgmt = true
        sandbox_cgroup_only = true
        pod_resource_api_sock = "/var/lib/kubelet/pod-resources/kubelet.sock"
      runtimeClass: |
        kind: RuntimeClass
        apiVersion: node.k8s.io/v1
        metadata:
          name: kata-clh-nvidia-gpu
          labels:
            app.kubernetes.io/managed-by: kata-deploy
            gpusandbox/support: experimental
        handler: kata-clh-nvidia-gpu
        overhead:
          podFixed:
            memory: "10240Mi"
            cpu: "1"
        scheduling:
          nodeSelector:
            nvidia.com/cc.ready.state: "false"
      inheritBaseOverhead: false
