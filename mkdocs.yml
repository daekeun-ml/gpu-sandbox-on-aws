            06 Agent Sandbox로 확장: 06 Extending with Agent Sandbox
            핸즈온: Hands-on
            핸즈온 전체 흐름: Hands-on overview
            공통 절차: Shared setup
            01 클러스터 프로비저닝: 01 Provision the cluster
            CDK로 EKS와 이미지 준비: Provision EKS with CDK and build the images
