site_name: GPU Sandbox on AWS
site_description: On-policy RL post-training on Amazon EKS and SageMaker HyperPod with gVisor and Kata + QEMU GPU sandboxes. The CPU lab includes Kata + Cloud Hypervisor.
site_url: https://daekeun-ml.github.io/gpu-sandbox-on-aws/
repo_url: https://github.com/daekeun-ml/gpu-sandbox-on-aws
repo_name: daekeun-ml/gpu-sandbox-on-aws
edit_uri: edit/main/docs/

docs_dir: docs
hooks:
  - tools/handson_redirects.py

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    # navigation.instant is left out: it breaks the i18n plugin's contextual language switch.
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.sections
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  # Click an image to see it full size (terminal screenshots are wide).
  - glightbox:
      zoomable: true
      draggable: false
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ko
          default: true
          name: 한국어
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            홈: Home
            "초심자 가이드": "Beginner guide"
            시작하기 전에: Before you begin
