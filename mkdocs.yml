            02 샌드박스 런타임 준비: 02 Prepare the sandbox runtime
            EC2에서 gVisor GPU 확인: Verify gVisor GPU access on EC2
            HyperPod 학습 노드 연결 (B1): Attach the HyperPod trainer (B1)
            HyperPod 채점 워커 준비 (B2): Prepare HyperPod graders (B2)
            EC2에서 Kata 실행: Run Kata on EC2
            03 채점 pool 배포와 검증: 03 Deploy and verify grading pools
            pool 설정과 검증 결과 읽기: Pool configuration and verification output
            시나리오별 실습: Scenario walkthroughs
