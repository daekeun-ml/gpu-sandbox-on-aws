site_name: GPU Sandbox on AWS
site_description: On-policy RL post-training with GPU reward sandboxes (gVisor, Kata + Cloud Hypervisor, Kata + QEMU) on Amazon EKS and SageMaker HyperPod
site_url: https://daekeun-ml.github.io/gpu-sandbox-on-aws/
repo_url: https://github.com/daekeun-ml/gpu-sandbox-on-aws
repo_name: daekeun-ml/gpu-sandbox-on-aws
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    # navigation.instant is left out: it breaks the i18n plugin's contextual language switch.
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.sections
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  # Click an image to see it full size (terminal screenshots are wide).
  - glightbox:
      zoomable: true
      draggable: false
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ko
          default: true
          name: 한국어
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            홈: Home
            "초심자 가이드": "Beginner guide"
            시작하기 전에: Before you begin
            01 AI가 만든 코드를 격리하는 이유: 01 Why AI-generated code needs isolation
            02 컨테이너와 샌드박스: 02 Containers and sandboxes
            03 GPU까지 격리하려면: 03 Isolating the GPU too
            04 강화학습과 샌드박스: 04 Reinforcement learning and sandboxes
            05 직접 해 보기: 05 Try it yourself
            06 multi-turn 에이전트와 Agent Sandbox: 06 Multi-turn agents and Agent Sandbox
            학습 코스 고르기: Choose a learning path
            시작하기: Getting started
            개념: Concepts
            01 GPU 샌드박스가 필요한 경우: 01 When the sandbox needs a GPU
            02 격리 런타임 비교: 02 Isolation runtimes
            03 On-policy RL과 샌드박스: 03 On-policy RL with sandboxes
            04 플랫폼과 인스턴스 선택: 04 Platforms and instances
            05 상황별 선택 가이드: 05 Decision guide
            06 Agent Sandbox로 확장: 06 Extending with Agent Sandbox
            핸즈온: Hands-on
            00 전체 흐름: 00 Overview
            01 클러스터와 이미지: 01 Cluster and images
            02 gVisor GPU 샌드박스: 02 gVisor GPU sandboxes
            03 Kata 샌드박스 (CLH, QEMU): 03 Kata sandboxes (CLH, QEMU)
            04 샌드박스 풀 배포와 검증: 04 Deploy and verify sandbox pools
            05 On-policy GRPO 학습: 05 On-policy GRPO training
            06 학습 중 샌드박스 업데이트: 06 Updating the sandbox during training
            07 HyperPod 시나리오: 07 HyperPod scenario
            07B HyperPod에서 전체 실습: 07B All workers on HyperPod
            08 런타임 벤치마크: 08 Runtime benchmark
            09 데모 사이트 (CloudFront): 09 Demo site (CloudFront)
            10 c8i 단독 저비용 경로: 10 CPU-only path on c8i
            11 multi-turn 에피소드 실습: 11 Multi-turn episodes
            99 정리: 99 Cleanup
            Production Ready: Production ready
            00 아키텍처: 00 Architecture
            01 용량과 노드 관리: 01 Capacity and nodes
            02 보안: 02 Security
            03 Gateway와 샌드박스 풀: 03 Gateway and pools
            04 Reward 무결성: 04 Reward integrity
            05 샌드박스 버전 관리: 05 Sandbox versioning
            06 veRL로 확장: 06 Scaling with veRL
            07 Observability와 운영: 07 Observability and operations
            08 비용: 08 Cost
            09 CDK로 프로비저닝: 09 Provisioning with CDK
            참고: Reference
            용어 사전: Glossary
            저장소 구조: Repository map
            스크립트 레퍼런스: Script reference
            설정 값: Configuration
            문제 해결: Troubleshooting
            자주 하는 오해: Misconceptions
            검증된 사실과 출처: Verified facts and sources
            참고 자료 모음: Selected references

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Bare URLs in the reference tables become clickable links.
  - pymdownx.magiclink
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

