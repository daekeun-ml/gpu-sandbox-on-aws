            EC2에서 GRPO 학습하기: Train with GRPO on EC2
            학습 중 채점 pool 교체하기: Switch grading pools during training
            시나리오 B (HyperPod): Scenario B (HyperPod)
            B1 (EC2에서 채점): B1 (grade on EC2)
            B2 (HyperPod에서 채점): B2 (grade on HyperPod)
